<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E6A4F">
<title>Caderneta da Família</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: conversa primeiro — saudação e um destaque guiado pelo perfil; navegação embaixo no celular, em linha no computador */
:root{
  --bg:#F4F5F1; --surface:#FFFFFF; --sunk:#EBEEE8; --ink:#1B2621; --muted:#68766F; --line:#E0E5DF;
  --accent:#1E6A4F; --accent-soft:#DCEBE3; --accent-ink:#FFFFFF; --gold:#B67F25;
  --good:#2D7A4E; --warn:#B07418; --crit:#B53B3B;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101714; --surface:#17201C; --sunk:#1D2823; --ink:#E6EDE9; --muted:#97A69F; --line:#26332E;
  --accent:#58B993; --accent-soft:#1F3A2F; --accent-ink:#0B1611; --gold:#DDA94E;
  --good:#62C48D; --warn:#E3AB4F; --crit:#E57272; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101714; --surface:#17201C; --sunk:#1D2823; --ink:#E6EDE9; --muted:#97A69F; --line:#26332E;
  --accent:#58B993; --accent-soft:#1F3A2F; --accent-ink:#0B1611; --gold:#DDA94E;
  --good:#62C48D; --warn:#E3AB4F; --crit:#E57272; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:400 clamp(1.9rem,6vw,2.6rem)/1.15 var(--f-display);letter-spacing:-.01em}
h2{font:600 1.08rem/1.3 var(--f-body)}
h3{font:600 1rem/1.3 var(--f-body)}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.pos{color:var(--good)} .neg{color:var(--crit)}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bar{display:flex;align-items:center;gap:14px;padding-block:12px}
.brand{font:400 1.2rem var(--f-display);white-space:nowrap}
.brand span{color:var(--accent)}
.people{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-left:auto;min-width:0;padding:2px}
.person{flex:none;display:flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--muted);border-radius:99px;padding:4px 12px 4px 4px;font:500 .92rem var(--f-body);cursor:pointer;transition:background .2s,color .2s}
.person .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--ink);font:600 .8rem var(--f-body);transition:background .2s,color .2s}
.person:hover{background:var(--sunk)}
.person[aria-pressed="true"]{color:var(--ink);background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.person[aria-pressed="true"] .av{background:var(--accent);color:var(--accent-ink)}
.person.add{padding:4px}
.person.add .av{background:transparent;border:1.5px dashed var(--muted);color:var(--accent);font-size:1.1rem}
nav.tabs{display:flex;gap:4px;padding-bottom:10px}
nav.tabs button{border:0;background:none;color:var(--muted);font:500 .95rem var(--f-body);padding:7px 14px;border-radius:99px;cursor:pointer;transition:background .2s,color .2s;position:relative}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--crit);margin-left:6px;vertical-align:2px}
.desk-add{margin-left:auto}
.themebtn{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--sunk);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:background .2s}
.themebtn:hover{background:var(--line)}
.themebtn svg{width:18px;height:18px}
.seg3{grid-template-columns:repeat(3,1fr);max-width:420px}
.seg3 button{display:flex;align-items:center;justify-content:center;gap:6px}
.seg3 svg{width:16px;height:16px}
nav.bottom{display:none}
main{padding-block:18px 80px}

@media (max-width:720px){
  nav.tabs,.desk-add{display:none}
  nav.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav.bottom button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font:500 .7rem var(--f-body);padding:4px 0;cursor:pointer;position:relative}
  nav.bottom button[aria-selected="true"]{color:var(--accent)}
  nav.bottom svg{width:22px;height:22px}
  nav.bottom .dot{position:absolute;top:2px;left:calc(50% + 8px);margin:0}
  main{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
  .fab{display:grid!important}
}
.fab{display:none;place-items:center;position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:7;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-size:1.8rem;line-height:1;box-shadow:0 6px 18px rgba(20,60,45,.28);cursor:pointer}

.enter>*{animation:rise .42s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}.enter>*:nth-child(5){animation-delay:.16s}.enter>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
.enter .fill{animation:grow .7s var(--ease) both .15s;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}}

.hello{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.hello .sub{color:var(--muted);font-size:1.02rem;max-width:60ch}
.hello .sub b{color:var(--ink);font-weight:600}
.monthpick{display:inline-flex;align-items:center;gap:2px;background:var(--sunk);border-radius:99px;padding:2px}
.monthpick button{border:0;background:none;color:var(--ink);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:1.05rem}
.monthpick button:hover{background:var(--surface)}
.monthpick span{font:500 .9rem var(--f-body);padding:0 6px;min-width:96px;text-align:center}

.panel{background:var(--surface);border-radius:16px;padding:20px;min-width:0}
.hero{background:var(--accent-soft);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px}
.hero .lead{font:400 clamp(1.35rem,4.2vw,1.85rem)/1.25 var(--f-display);max-width:28ch}
.hero .lead em{font-style:normal;color:var(--accent)}
.hero p{color:var(--muted);max-width:58ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}

.track{height:8px;border-radius:4px;background:var(--sunk);position:relative;overflow:hidden}
.hero .track{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.fill{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent)}
.fill.warn{background:var(--warn)} .fill.crit{background:var(--crit)} .fill.gold{background:var(--gold)}
.mark{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--ink);opacity:.5}
.brow{display:flex;flex-direction:column;gap:6px}
.brow .top{display:flex;justify-content:space-between;gap:10px;font-size:.92rem}
.brow .top b{font-weight:600;white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:14px}
svg text{fill:var(--muted);font:500 11px var(--f-body)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line);border-radius:10px;cursor:pointer;transition:background .15s}
.li:first-child{border-top:0}
.li:hover{background:var(--sunk)}
.li .ic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--sunk);font:600 .85rem var(--f-body);color:var(--muted)}
.li .ic.in{background:var(--accent-soft);color:var(--accent)}
.li .t{flex:1;min-width:0}
.li .t div:first-child{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t div+div{font-size:.84rem;color:var(--muted)}
.li .v{font-weight:600;white-space:nowrap}
.dayhead{font:600 .8rem var(--f-body);color:var(--muted);padding:14px 4px 4px}
.dayhead::first-letter{text-transform:uppercase}

.notes{display:flex;flex-direction:column;gap:2px}
.note{display:flex;gap:12px;padding:12px 4px;border-top:1px solid var(--line)}
.note:first-child{border-top:0}
.note .b{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px}
.note.crit .b{background:var(--crit)} .note.warn .b{background:var(--warn)} .note.info .b{background:var(--accent)} .note.ok .b{background:var(--good)}
.note h3{font-weight:600}
.note p{color:var(--muted);font-size:.93rem;margin-top:2px;max-width:66ch}

.acct{display:flex;flex-direction:column;gap:14px;cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s}
.acct:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.06)}
.acct .kind{font-size:.84rem;color:var(--muted)}
.acct .bal{font:600 1.45rem var(--f-body)}
.goal{display:flex;flex-direction:column;gap:14px}
.goal .track{height:10px}

.btn{font:600 .93rem var(--f-body);border-radius:12px;padding:10px 16px;border:0;background:var(--sunk);color:var(--ink);cursor:pointer;transition:background .2s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.link{background:none;padding:6px 4px;color:var(--accent)}
.btn.danger{color:var(--crit);background:none}
.btn.armed{background:var(--crit);color:#fff}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.li:focus-visible,.acct:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.86rem;color:var(--muted);min-width:0}
input,select,textarea{font:400 1rem var(--f-body);color:var(--ink);background:var(--sunk);border:1.5px solid transparent;border-radius:12px;padding:11px 12px;width:100%;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{min-height:110px;font-size:.82rem}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select{width:auto;max-width:100%;padding:8px 10px;font-size:.9rem}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:9px;border-radius:10px;font:600 .93rem var(--f-body);color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.amount{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding-bottom:6px;transition:border-color .2s}
.amount:focus-within{border-color:var(--accent)}
.amount span{font:400 1.3rem var(--f-display);color:var(--muted)}
.amount input{font:400 2.2rem/1.1 var(--f-display);background:none;border:0;padding:0;border-radius:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:6px 12px;font:500 .88rem var(--f-body);cursor:pointer;transition:all .15s}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

dialog{border:0;border-radius:22px;background:var(--surface);color:var(--ink);padding:0;width:min(540px,calc(100vw - 32px));max-height:calc(100dvh - 40px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog[open]{animation:pop .28s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}}
dialog::backdrop{background:rgba(10,18,15,.42);backdrop-filter:blur(3px)}
.sheet{padding:24px;display:flex;flex-direction:column;gap:18px}
.sheet .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:720px){
  dialog.sh{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:22px 22px 0 0;max-height:92dvh}
  dialog.sh[open]{animation:up .32s var(--ease)}
  dialog.sh .sheet{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
}
@keyframes up{from{transform:translateY(100%)}}

#quiz{width:min(620px,100vw);max-width:100vw;height:min(720px,100dvh);max-height:100dvh}
@media (max-width:720px){#quiz{width:100vw;height:100dvh;border-radius:0;margin:0}}
.qz{height:100%;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px))}
.qz .progress{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden;flex:none}
.qz .progress i{display:block;height:100%;background:var(--accent);transition:width .4s var(--ease)}
.qz .nav{display:flex;justify-content:space-between;align-items:center;margin:10px 0 0;flex:none}
.qz .body{flex:1;overflow-y:auto;display:flex;flex-direction:column;justify-content:safe center;gap:22px;padding-block:20px}
.qz .body.go{animation:slide .38s var(--ease) both}
.qz .body.back{animation:slideb .38s var(--ease) both}
@keyframes slide{from{opacity:0;transform:translateX(24px)}}
@keyframes slideb{from{opacity:0;transform:translateX(-24px)}}
.qz .q{font:400 clamp(1.45rem,5vw,1.95rem)/1.25 var(--f-display)}
.qz .hint{color:var(--muted);margin-top:-10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:14px 16px;font:500 1rem var(--f-body);cursor:pointer;transition:border-color .15s,background .15s;display:flex;align-items:center;gap:12px}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .ck{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--accent-ink)}
.opt.radio .ck{border-radius:50%}
.opt[aria-pressed="true"] .ck{background:var(--accent);border-color:var(--accent)}
.big-in{font:400 1.8rem var(--f-display);background:none;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:4px 0}
.big-in:focus{border-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:20px}
.stepper button{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);background:none;color:var(--ink);font-size:1.5rem;cursor:pointer}
.stepper output{font:400 2.6rem var(--f-display);min-width:2ch;text-align:center}
.result{display:flex;flex-direction:column;gap:12px}
.result .r{background:var(--sunk);border-radius:14px;padding:14px 16px}
.result .r span{display:block;font-size:.84rem;color:var(--muted)}
.result .r strong{font:600 1.08rem var(--f-body)}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin-top:8px}
.split i{display:block;height:100%}

.invite{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:18px;padding:18px 20px}
.invite p{opacity:.8;font-size:.92rem}
.invite .btn{background:var(--bg);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.92rem;z-index:30;animation:pop .25s var(--ease);white-space:nowrap}
@media (min-width:721px){.toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* base */
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* entrada */
.gate{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;display:flex;align-items:safe center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.gcard{width:min(420px,100%);display:flex;flex-direction:column;gap:18px;animation:rise .45s var(--ease) both}
.gcard .brand{font-size:1.5rem}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.86rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.gbox{background:var(--surface);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--sunk);border-top-color:var(--accent);animation:sp 0.8s linear infinite;margin:auto}
@keyframes sp{to{transform:rotate(360deg)}}
.code{font:600 1.5rem var(--f-body);letter-spacing:.18em}
.sync{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.sync.off i{background:var(--warn)}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand">Caderneta<span>.</span></div>
      <span class="sync" id="sync" title="Sincronização"><i></i><span>salvo</span></span>
      <div class="people" id="people"></div>
      <button class="themebtn" id="themebtn" data-act="temaCiclo"></button>
    </div>
    <div class="row" style="flex-wrap:nowrap">
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <button class="btn primary desk-add" data-act="novoLanc" style="margin-bottom:10px">Lançar</button>
    </div>
  </div>
</header>
<main class="wrap" id="main"></main>
<nav class="bottom" id="bottom"></nav>
<button class="fab" data-act="novoLanc" aria-label="Novo lançamento">+</button>
<dialog id="dlg" class="sh"><form id="dlgForm" class="sheet"></form></dialog>
<dialog id="quiz"><div class="qz" id="qz"></div></dialog>
<div class="toast" id="toast" hidden></div>
<div class="gate" id="gate"><div class="gcard"><div class="spin"></div></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getDatabase,ref,get,set,update,remove,onValue,push} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyBHxT1B5WOYM4nY9rHJjoJ5wZbZBi-NMuU",
  authDomain:"financas-447dc.firebaseapp.com",
  databaseURL:"https://financas-447dc-default-rtdb.firebaseio.com",
  projectId:"financas-447dc",
  storageBucket:"financas-447dc.firebasestorage.app",
  messagingSenderId:"698102914500",
  appId:"1:698102914500:web:7592da7c932869f3405891"
};
const fbApp=initializeApp(firebaseConfig);
const auth=getAuth(fbApp);
const db=getDatabase(fbApp);

function calcPlano(a){
  let s=30,f=20;
  if((a.dividas||[]).some(x=>['cheque','cartao','emprestimo'].includes(x))){f+=10;s-=10}
  if(a.rendaVar==='muito'){f+=5;s-=5}
  if((+a.dependentes||0)>=2){s-=5}
  if(a.dizimo==='10'){s-=5;f-=5}
  if(s<10){f-=10-s;s=10}
  f=Math.max(10,f);
  return {e:100-s-f,s,f};
}
function perfilDe(a){let r=a.risco||'moderado';if((+a.idade||0)>=60&&r==='arrojado')r='moderado';return r}
const plano=p=>p.quiz?calcPlano(p.quiz):{e:50,s:30,f:20};
function mesesReserva(p){
  const a=p.quiz||{};
  let m={servidor:3,clt:6,aposentado:6,autonomo:12,empresario:12}[p.tipoRenda]||6;
  m+=({pouco:2,muito:4})[a.rendaVar]||0;
  m+=Math.min(+p.dependentes||0,3);
  return Math.min(m,18);
}
function metasSugeridas(a,p){
  const r=+a.renda||0, essencial=r*calcPlano(a).e/100, anos=n=>addM(curYM,12*n), out=[];
  const mr=mesesReserva({tipoRenda:a.tipoRenda,dependentes:a.dependentes,quiz:a});
  const ob=a.objetivos||[];
  if(r&&(ob.includes('reserva')||(+a.reserva<mr))) out.push({nome:'Reserva de emergência',alvo:Math.round(essencial*mr/100)*100,atual:Math.round(essencial*Math.min(+a.reserva||0,mr)/100)*100,prazo:anos(1.5)});
  if(ob.includes('dividas')&&+a.dividaTotal) out.push({nome:'Sair das dívidas',alvo:+a.dividaTotal,atual:0,prazo:anos(1)});
  if(r){
    if(ob.includes('casa')) out.push({nome:'Entrada da casa',alvo:Math.round(r*20/1000)*1000,atual:0,prazo:anos(5)});
    if(ob.includes('carro')) out.push({nome:'Carro',alvo:Math.round(r*6/1000)*1000,atual:0,prazo:anos(2)});
    if(ob.includes('viagem')) out.push({nome:'Viagem',alvo:Math.round(r*1.5/100)*100,atual:0,prazo:anos(1)});
    if(ob.includes('estudos')) out.push({nome:'Estudos',alvo:Math.round(r*8/1000)*1000,atual:0,prazo:anos(4)});
    if(ob.includes('aposentadoria')){const anosAte=Math.max(5,65-(+a.idade||40));out.push({nome:'Aposentadoria',alvo:Math.round(r*12*25/10000)*10000,atual:0,prazo:anos(anosAte)})}
    if(ob.includes('negocio')) out.push({nome:'Negócio próprio',alvo:Math.round(r*10/1000)*1000,atual:0,prazo:anos(3)});
  }
  return out.filter(g=>!p||!p.metas.some(x=>x.nome.toLowerCase().split(' ')[0]===g.nome.toLowerCase().split(' ')[0]));
}

const arr=x=>Array.isArray(x)?x.filter(Boolean):x&&typeof x==='object'?Object.values(x):[];
function normal(p){
  p.contas=arr(p.contas); p.lanc=arr(p.lanc); p.metas=arr(p.metas); p.limites=p.limites||{};
  if(p.quiz){p.quiz.dividas=arr(p.quiz.dividas);p.quiz.objetivos=arr(p.quiz.objetivos)}
  return p;
}
function syncState(ok,txt){const el=$('#sync');if(!el)return;el.classList.toggle('off',!ok);el.lastElementChild.textContent=txt}
function save(){
  try{localStorage.setItem(KEY+':ativo',S.ativo||'')}catch(e){}
  if(!FAM) return;
  const vivos=new Set();
  S.profiles.forEach(p=>{
    if(!p.ordem) p.ordem=Date.now()+Math.random();
    vivos.add(p.id);
    const js=JSON.stringify(p);
    if(synced[p.id]!==js){
      synced[p.id]=js; syncState(false,'salvando…');
      set(ref(db,`familias/${FAM.id}/perfis/${p.id}`),JSON.parse(js)).then(()=>syncState(true,'salvo')).catch(err=>{syncState(false,'erro ao salvar');toast('Não foi possível salvar. Verifique a conexão.');console.error(err)});
    }
  });
  Object.keys(synced).forEach(id=>{if(!vivos.has(id)){delete synced[id];remove(ref(db,`familias/${FAM.id}/perfis/${id}`)).catch(console.error)}});
}

function saldoConta(p,c){
  const ls=p.lanc.filter(l=>l.contaId===c.id);
  const ent=ls.filter(l=>l.tipo==='receita').reduce((s,l)=>s+l.valor,0), sai=ls.filter(l=>l.tipo==='despesa').reduce((s,l)=>s+l.valor,0);
  if(c.tipo==='cartao') return -(Math.abs(+c.saldoInicial||0)+sai-ent);
  return (+c.saldoInicial||0)+ent-sai;
}
function doMes(p,m){
  const ls=p.lanc.filter(l=>ym(l.data)===m);
  const rec=ls.filter(l=>l.tipo==='receita'&&grupoDe(l.cat)==='receita').reduce((s,l)=>s+l.valor,0);
  const g={essencial:0,estilo:0,futuro:0}, porCat={};
  ls.filter(l=>l.tipo==='despesa').forEach(l=>{const gr=grupoDe(l.cat);if(!(gr in g))return;g[gr]+=l.valor;porCat[l.cat]=(porCat[l.cat]||0)+l.valor});
  const consumo=g.essencial+g.estilo, desp=consumo+g.futuro, base=rec||p.renda||0;
  return {rec,desp,consumo,g,porCat,base,n:ls.length,taxaPoup:base?(base-consumo)/base:0};
}
const patrimonio=p=>p.contas.reduce((s,c)=>s+saldoConta(p,c),0);
const liquidez=p=>p.contas.filter(c=>['corrente','poupanca','investimento','carteira'].includes(c.tipo)).reduce((s,c)=>s+Math.max(0,saldoConta(p,c)),0);
const dividaCartao=p=>p.contas.filter(c=>c.tipo==='cartao').reduce((s,c)=>s+Math.max(0,-saldoConta(p,c)),0);
const chequeEsp=p=>p.contas.filter(c=>c.tipo==='corrente').reduce((s,c)=>s+Math.max(0,-saldoConta(p,c)),0);
function custoEssencial(p){
  const ms=[0,1,2].map(k=>doMes(p,addM(curYM,-k)).g.essencial).filter(v=>v>0);
  return ms.length?ms.reduce((a,b)=>a+b,0)/ms.length:(p.renda||0)*plano(p).e/100;
}

function alertas(p){
  const A=[], a=p.quiz||{}, m=doMes(p,curYM), renda=Math.max(m.rec,p.renda||0), pl=plano(p);
  const ess=custoEssencial(p), nm=mesesReserva(p), alvoRes=ess*nm, liq=liquidez(p), cob=ess?liq/ess:0;
  const add=(n,t,x)=>A.push({n,t,x});
  if(m.rec>0&&m.desp>m.rec) add('crit','Saiu mais do que entrou este mês',`Foram ${brl0(m.desp)} de saídas para ${brl0(m.rec)} de entradas. Segure primeiro os gastos de estilo de vida (${brl0(m.g.estilo)} até agora), não os aportes.`);
  p.contas.filter(c=>c.tipo==='corrente'&&saldoConta(p,c)<0).forEach(c=>add('crit',`${c.banco} está no negativo`,`São ${brl(-saldoConta(p,c))} no cheque especial, um dos créditos mais caros do país. Cubra com a reserva, ou troque por um empréstimo de juros menores.`));
  const temDividaCara=(a.dividas||[]).some(x=>['cheque','cartao'].includes(x))||chequeEsp(p)>0;
  if(temDividaCara) add('crit','Quite a dívida cara antes de investir','Nenhum investimento comum rende o que o cheque especial e o rotativo do cartão cobram. Todo dinheiro que sobrar vai primeiro para essas dívidas; depois, para a reserva.');
  const dc=dividaCartao(p);
  if(renda&&dc>renda) add('crit','A fatura passou da sua renda do mês',`Faturas em ${brl0(dc)}. Se não der para pagar inteira, fuja do rotativo: negocie um parcelamento com taxa fixa ou use um crédito mais barato.`);
  else if(renda&&dc>renda*.3) add('warn','O cartão está pesando',`As faturas somam ${brl0(dc)}, ${pct(dc/renda)} da renda. Pague sempre o total e use um cartão só, para enxergar o gasto.`);
  if(cob<1) add('crit','Você ainda não tem reserva de emergência',`O que você tem disponível cobre menos de um mês de gastos essenciais. Para o seu caso, o ideal são ${nm} meses, cerca de ${brl0(alvoRes)}. Comece com pouco, todo mês, no dia em que a renda cai.`);
  else if(cob<nm) add('warn',`A reserva cobre ${cob.toFixed(1).replace('.',',')} de ${nm} meses`,`Faltam ${brl0(alvoRes-liq)}. Guarde em algo de baixo risco que você possa sacar no mesmo dia, como Tesouro Selic ou CDB com liquidez diária.`);
  else add('ok','Reserva de emergência completa',`${cob.toFixed(1).replace('.',',')} meses de gastos essenciais garantidos. Daqui pra frente, as sobras podem ir para os seus objetivos.`);
  if(m.rec>0){
    if(m.taxaPoup<pl.f/100-0.05) add('warn',`Você está guardando ${pct(m.taxaPoup)} do que entra`,`O seu plano prevê ${pl.f}%. Separe esse valor assim que a renda cair, antes de começar a gastar.`);
    else if(m.taxaPoup>=pl.f/100) add('ok',`Guardando ${pct(m.taxaPoup)} do que entra`,`Acima dos ${pl.f}% do seu plano. Direcione o que passar disso para as metas.`);
  }
  const mor=m.porCat['Moradia']||0;
  if(renda&&mor/renda>.3) add('warn',`Moradia levando ${pct(mor/renda)} da renda`,a.moradia==='aluguel'?'Acima de 30% o orçamento perde folga. Se o contrato estiver perto de vencer, vale pesquisar e negociar o valor.':'Acima de 30% o orçamento perde folga. Em financiamento, amortizar com sobras reduz bastante os juros totais; prefira reduzir o prazo, não a parcela.');
  Object.entries(p.limites||{}).forEach(([cat,lim])=>{const g=m.porCat[cat]||0;if(!lim)return;
    if(g>lim) add('crit',`Passou do limite em ${cat}`,`${brl0(g)} gastos para um limite de ${brl0(lim)}.`);
    else if(g>=lim*.8) add('warn',`${cat} perto do limite`,`Restam ${brl0(lim-g)} dos ${brl0(lim)} que você definiu para o mês.`);});
  const porBanco={};
  p.contas.filter(c=>c.tipo!=='cartao').forEach(c=>porBanco[c.banco]=(porBanco[c.banco]||0)+Math.max(0,saldoConta(p,c)));
  Object.entries(porBanco).forEach(([b,v])=>{if(v>250000) add('warn',`${b} guarda mais do que o FGC cobre`,`São ${brl0(v)} na mesma instituição. A garantia do FGC vai até R$ 250 mil por CPF e instituição (confira o limite atual no site do FGC). Divida entre bancos ou use Tesouro Direto.`)});
  const sobra=Math.max(0,renda-m.consumo); let soma=0;
  p.metas.forEach(g=>{const falta=g.alvo-g.atual,meses=monthsBetween(curYM,g.prazo);if(falta<=0)return;
    if(meses<0) add('crit',`O prazo de "${g.nome}" passou`,`Faltaram ${brl0(falta)}. Ajuste prazo ou valor para a meta voltar a ser possível.`); else soma+=falta/Math.max(1,meses)});
  if(soma>sobra&&soma>0) add('warn','As metas pedem mais do que sobra',`Elas exigem ${brl0(soma)} por mês e sobram cerca de ${brl0(sobra)}. Foque em uma de cada vez ou estique os prazos.`);
  if(a.rendaVar==='muito') add('info','Pague um salário a você mesmo','Com renda variável, deixe tudo que entra numa conta separada e transfira um valor fixo por mês para a conta do dia a dia, calculado pela média dos meses mais fracos. Os meses bons reforçam a reserva.');
  if(p.perfilInv==='arrojado'&&cob<nm) add('info','Reserva antes de bolsa','Antes de aumentar ações, fundos imobiliários ou cripto, complete a reserva. Sem ela, um imprevisto pode obrigar você a vender na baixa.');
  if((p.idade||0)>=45&&!p.metas.some(g=>/aposent|previd|independ/i.test(g.nome))) add('info','Nenhuma meta de aposentadoria',`Aos ${p.idade} anos, cada ano de aporte pesa mais. Crie uma meta e avalie previdência privada: o PGBL vale a pena para quem declara IR no modelo completo.`);
  if(['autonomo','empresario'].includes(p.tipoRenda)&&!p.lanc.some(l=>l.cat==='Previdência')) add('info','Sem INSS registrado','Por conta própria, ninguém recolhe o INSS por você. Registre o carnê ou o DAS do MEI, que também garantem auxílio-doença e licença.');
  if((p.dependentes||0)>0&&!p.lanc.some(l=>l.cat==='Seguros')) add('info','Família sem seguro de vida',`Com ${p.dependentes} ${p.dependentes>1?'pessoas':'pessoa'} dependendo de você, um seguro de vida protege a casa se a sua renda faltar. Costuma custar pouco perto da cobertura.`);
  if(a.foco==='paraOnde'&&m.n<12) add('info','Lance tudo por 30 dias','Só dá para saber para onde o dinheiro vai com os gastos pequenos anotados também. Use o botão + logo depois de pagar; leva segundos.');
  const ord={crit:0,warn:1,info:2,ok:3};
  return A.sort((x,y)=>ord[x.n]-ord[y.n]).map(x=>({...x,x:tom(p)==='curto'?firstSentence(x.x):x.x}));
}

const $=s=>document.querySelector(s);
const ICON={
  inicio:'<path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1z"/>',

  metas:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/>',

};
const TABS=[['inicio','Início'],['extrato','Extrato'],['contas','Contas'],['metas','Metas'],['alertas','Atenção'],['perfil','Perfil']];

function render(){
  const p=P();

    $('#people').innerHTML=`<button class="person add" data-act="novoPerfil" aria-label="Adicionar pessoa"><span class="av">+</span></button>`;

      <div class="row"><button class="btn primary" data-act="novoPerfil">Adicionar pessoa</button></div>
      <section class="panel stack" style="gap:12px"><h2>Já usava a Caderneta?</h2><p class="small muted">Na versão anterior, vá em Perfil, toque em "Copiar backup", cole o texto aqui e importe.</p>
      <textarea id="bk" aria-label="Backup" placeholder="Cole aqui o backup"></textarea><div class="row"><button class="btn" data-act="importar">Importar</button></div></section></div>`;

  const crit=alertas(p).some(a=>a.n==='crit');

  $('#bottom').innerHTML=TABS.filter(t=>t[0]!=='perfil').map(([k,l])=>`<button data-act="tab" data-id="${k}" aria-selected="${tab===k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>${l}${k==='alertas'&&crit?'<span class="dot"></span>':''}</button>`).join('');

function go(t){
  tab=t; animate=true; try{localStorage.setItem(KEY+':tab',t)}catch(e){}
  render(); window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});
}
const monthPick=()=>`<div class="monthpick"><button data-act="mes" data-id="-1" aria-label="Mês anterior">‹</button><span>${mLabel(mes)}</span><button data-act="mes" data-id="1" aria-label="Próximo mês">›</button></div>`;
function saud(){const h=today.getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'}
const bar=(v,max,cls='',mark)=>`<div class="track"><i class="fill ${cls}" style="width:${Math.max(0,Math.min(100,v/(max||1)*100))}%"></i>${mark!=null?`<span class="mark" style="left:${Math.min(99.5,mark/(max||1)*100)}%"></span>`:''}</div>`;

function hero(p,m){
  const foco=p.quiz?.foco||'fimDoMes', pl=plano(p), a=p.quiz||{};
  const renda=Math.max(m.rec,p.renda||0);
  if(foco==='fimDoMes'){
    if(mes!==curYM){const sob=m.rec-m.desp;return `<div class="hero"><div class="lead">Em ${mNome(mes)}, ${sob>=0?`sobraram <em>${brl0(sob)}</em>`:`faltaram <em>${brl0(-sob)}</em>`}.</div><p>Entraram ${brl0(m.rec)} e saíram ${brl0(m.desp)}.</p></div>`}
    const guardar=renda*pl.f/100, teto=renda-guardar, disp=teto-m.consumo;
    const ult=new Date(today.getFullYear(),today.getMonth()+1,0).getDate(), dias=ult-today.getDate()+1;
    const lead=disp>0?`Dá para gastar <em>${brl0(disp/dias)} por dia</em> até ${ult} de ${mNome(curYM)}.`:`Você já passou <em>${brl0(-disp)}</em> do que dava para gastar este mês.`;
    return `<div class="hero"><div class="lead">${lead}</div>
      <p>Isso já separa os ${brl0(guardar)} que você planejou guardar (${pl.f}% da renda). ${disp>0?`Restam ${brl0(disp)} para os próximos ${dias} dias.`:'Se der, adie compras que não são essenciais até o mês virar.'}</p>
      <div class="brow"><div class="top"><span>Gasto do mês</span><b>${brl0(m.consumo)} de ${brl0(teto)}</b></div>${bar(m.consumo,Math.max(teto,m.consumo),m.consumo>teto?'crit':m.consumo>teto*.85?'warn':'',teto*today.getDate()/ult)}<span class="small muted">A marca mostra onde você estaria hoje gastando por igual todos os dias.</span></div></div>`;
  }
  if(foco==='dividas'){
    const total=Math.max(dividaCartao(p)+chequeEsp(p),+a.dividaTotal||0);
    const meta=p.metas.find(g=>/d[ií]vida/i.test(g.nome));
    const ordem=['cheque','cartao','emprestimo','financiamento'].filter(x=>(a.dividas||[]).includes(x)).map(x=>({cheque:'cheque especial',cartao:'cartão',emprestimo:'empréstimo',financiamento:'financiamento'})[x]);
    const sobra=Math.max(0,renda-m.consumo), mq=sobra?Math.ceil(total/sobra):0;
    return `<div class="hero"><div class="lead">${total?`Suas dívidas somam <em>${brl0(total)}</em>.`:'Nenhuma dívida cara registrada.'}</div>
      <p>${ordem.length>1?`Pague na ordem dos juros: ${ordem.join(', depois ')}. `:''}${mq&&total?`Com a sobra atual, de ${brl0(sobra)} por mês, dá para quitar em cerca de ${mq} ${mq>1?'meses':'mês'}.`:''}</p>
      ${meta?`<div class="brow"><div class="top"><span>${esc(meta.nome)}</span><b>${pct(meta.atual/meta.alvo)}</b></div>${bar(meta.atual,meta.alvo)}</div>`:''}</div>`;
  }
  if(foco==='paraOnde'){
    const cats=Object.entries(m.porCat).filter(([c])=>grupoDe(c)!=='futuro').sort((x,y)=>y[1]-x[1]).slice(0,3);
    if(!cats.length) return `<div class="hero"><div class="lead">Ainda não há gastos em ${mNome(mes)}.</div><p>Lance cada compra logo depois de pagar. Em poucas semanas você vai ver o retrato completo.</p></div>`;
    return `<div class="hero"><div class="lead"><em>${esc(cats[0][0])}</em> é para onde mais vai o seu dinheiro em ${mNome(mes)}.</div>
      <div class="bars">${cats.map(([c,v])=>`<div class="brow"><div class="top"><span>${esc(c)}</span><b>${brl0(v)} · ${pct(v/(m.consumo||1))}</b></div>${bar(v,cats[0][1],'gold')}</div>`).join('')}</div></div>`;
  }
  if(foco==='guardar'){
    const t=m.taxaPoup, alvo=pl.f/100, val=renda*alvo;
    return `<div class="hero"><div class="lead">${m.rec?`Você está guardando <em>${pct(Math.max(0,t))}</em> do que entrou.`:`Sua meta é guardar <em>${brl0(val)}</em> por mês.`}</div>
      <p>O seu plano é ${pl.f}%, ou ${brl0(val)}. ${t>=alvo?'Está no caminho; mantenha o ritmo.':'Um truque que funciona: programe uma transferência automática para o dia em que a renda cai.'}</p>
      <div class="brow"><div class="top"><span>Guardado</span><b>${pct(Math.max(0,t))} de ${pl.f}%</b></div>${bar(Math.max(0,t),Math.max(alvo,t,.01),t>=alvo?'':'warn')}</div></div>`;
  }
  const ess=custoEssencial(p), nm=mesesReserva(p), liq=liquidez(p), cob=ess?liq/ess:0;
  const aloc={conservador:[['Pós-fixados (Selic, CDI)',70],['Inflação (IPCA+)',30]],moderado:[['Pós-fixados',50],['Inflação (IPCA+)',30],['Ações e FIIs',20]],arrojado:[['Pós-fixados',30],['Inflação (IPCA+)',30],['Ações, FIIs e exterior',40]]}[p.perfilInv]||[];
  const cores=['var(--accent)','var(--gold)','var(--muted)'];
  return `<div class="hero"><div class="lead">${cob>=nm?`Reserva pronta. Agora o dinheiro pode <em>trabalhar</em>.`:`Primeiro passo: completar <em>${nm} meses</em> de reserva.`}</div>
    <div class="brow"><div class="top"><span>Reserva de emergência</span><b>${cob.toFixed(1).replace('.',',')} de ${nm} meses</b></div>${bar(cob,nm)}</div>
    <div><div class="small muted">Divisão de referência para o perfil ${PERFIL_INV[p.perfilInv].toLowerCase()}, depois da reserva:</div>
    <div class="split">${aloc.map((x,i)=>`<i style="width:${x[1]}%;background:${cores[i]}"></i>`).join('')}</div>
    <div class="row small" style="gap:14px;margin-top:8px">${aloc.map((x,i)=>`<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${cores[i]};margin-right:6px"></span>${x[0]} ${x[1]}%</span>`).join('')}</div>
    <p class="small" style="margin-top:8px">Referência educativa, não é recomendação de investimento.</p></div></div>`;
}

function inicio(p){
  const m=doMes(p,mes), pl=plano(p), A=alertas(p).filter(a=>a.n!=='ok').slice(0,3), a=p.quiz;
  const base=m.base||1;
  const meses=[...Array(6)].map((_,i)=>addM(mes,i-5)).map(mm=>({mm,...doMes(p,mm)}));
  const vmax=Math.max(1,...meses.map(x=>Math.max(x.rec,x.desp)));
  const W=520,H=170,pb=24,bw=W/6, sc=v=>(H-pb-14)*v/vmax;
  const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Entradas e saídas dos últimos 6 meses">
    <line x1="0" x2="${W}" y1="${H-pb-sc(vmax/2)}" y2="${H-pb-sc(vmax/2)}" stroke="var(--line)" stroke-dasharray="2 5"/>
    <line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>
    ${meses.map((x,i)=>{const cx=i*bw+bw/2;return `<rect x="${cx-16}" y="${H-pb-sc(x.rec)}" width="14" height="${sc(x.rec)}" rx="3" fill="var(--accent)"/><rect x="${cx+2}" y="${H-pb-sc(x.desp)}" width="14" height="${sc(x.desp)}" rx="3" fill="${x.desp>x.rec?'var(--crit)':'var(--gold)'}"/><text x="${cx}" y="${H-6}" text-anchor="middle" ${x.mm===mes?'style="fill:var(--ink);font-weight:600"':''}>${mNome(x.mm).slice(0,3)}</text>`}).join('')}
    <text x="2" y="${H-pb-sc(vmax/2)-5}">${brl0(vmax/2)}</text></svg>`;
  const grupos=[['Essenciais',m.g.essencial,pl.e,'',true],['Estilo de vida',m.g.estilo,pl.s,'gold',true],['Guardado',Math.max(0,base-m.consumo),pl.f,'',false]];
  const dz=a?.dizimo==='10'?{prev:base*.1,lanc:m.porCat['Dízimos e ofertas']||0}:null;
  const cats=Object.entries(m.porCat).sort((x,y)=>y[1]-x[1]).slice(0,6);
  return `
  <div class="hello"><div class="row between"><span class="muted">${saud()},</span>${monthPick()}</div>
    <h1>${esc(p.nome)}</h1>
    <p class="sub">${m.rec||m.desp?`Em ${mNome(mes)}, entraram <b>${brl0(m.rec)}</b> e saíram <b>${brl0(m.desp)}</b>. Somando as contas, você tem <b>${brl0(patrimonio(p))}</b>.`:`Nada lançado em ${mNome(mes)} ainda.`}</p></div>
  ${!a?`<div class="invite"><div><h3>Vamos conhecer você melhor?</h3><p>São 2 minutos de perguntas para ajustar a reserva, o orçamento e os conselhos.</p></div><button class="btn" data-act="quiz">Responder</button></div>`:''}
  ${hero(p,m)}
  ${A.length?`<section class="panel"><div class="row between" style="margin-bottom:4px"><h2>Fique de olho</h2><button class="btn link" data-act="tab" data-id="alertas">Ver tudo</button></div><div class="notes">${A.map(noteHTML).join('')}</div></section>`:''}
  <div class="grid2">
    <section class="panel stack" style="gap:16px"><div><h2>Seu plano do mês</h2><p class="small muted">${pl.e}% essenciais, ${pl.s}% estilo de vida, ${pl.f}% para guardar${a?', ajustado ao seu perfil':''}.</p></div>
      <div class="bars">${grupos.map(([l,v,pp,c,teto])=>{const alvo=base*pp/100;const ruim=teto?v>alvo:v<alvo;return `<div class="brow"><div class="top"><span>${l}</span><b class="${ruim?'neg':''}">${brl0(v)} <span class="muted" style="font-weight:400">de ${brl0(alvo)}</span></b></div>${bar(v,Math.max(alvo,v),ruim?(teto?'crit':'warn'):c,alvo)}</div>`}).join('')}
      ${dz?`<div class="brow"><div class="top"><span>Dízimo previsto</span><b>${brl0(dz.lanc)} <span class="muted" style="font-weight:400">de ${brl0(dz.prev)}</span></b></div>${bar(dz.lanc,dz.prev,'gold')}</div>`:''}</div>
    </section>
    <section class="panel stack" style="gap:12px"><h2>Últimos 6 meses</h2>${svg}
      <div class="row small muted" style="gap:16px"><span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--accent);margin-right:6px"></span>Entradas</span><span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--gold);margin-right:6px"></span>Saídas</span><span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--crit);margin-right:6px"></span>Saiu mais que entrou</span></div>
    </section>
  </div>
  ${cats.length?`<section class="panel stack" style="gap:14px"><h2>Por categoria</h2><div class="bars">${cats.map(([c,v])=>{const lim=p.limites?.[c];const max=Math.max(cats[0][1],lim||0);return `<div class="brow"><div class="top"><span>${esc(c)}${lim?` <span class="muted small">· limite ${brl0(lim)}</span>`:''}</span><b>${brl(v)}</b></div>${bar(v,max,lim?(v>lim?'crit':v>=lim*.8?'warn':''):'',lim)}</div>`}).join('')}</div></section>`:''}`;
}
function noteHTML(a){return `<div class="note ${a.n}"><span class="b"></span><div><h3>${esc(a.t)}</h3><p>${esc(a.x)}</p></div></div>`}

function extrato(p){
  let ls=p.lanc.filter(l=>ym(l.data)===mes).sort((a,b)=>b.data.localeCompare(a.data));
  if(filtro.conta) ls=ls.filter(l=>l.contaId===filtro.conta);
  if(filtro.cat) ls=ls.filter(l=>l.cat===filtro.cat);
  const tot=ls.reduce((s,l)=>s+(l.tipo==='receita'?l.valor:-l.valor),0);
  const nomeC=id=>p.contas.find(c=>c.id===id)?.banco||'—';
  const cats=[...new Set(p.lanc.map(l=>l.cat))].sort();
  const dias={}; ls.forEach(l=>(dias[l.data]=dias[l.data]||[]).push(l));
  const dLabel=d=>{const dt=new Date(d+'T12:00');const diff=Math.round((new Date(today.toDateString())-new Date(dt.toDateString()))/864e5);return diff===0?'Hoje':diff===1?'Ontem':dt.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})};
  return `<div class="hello"><div class="row between"><h1>Extrato</h1>${monthPick()}</div>
    ${ls.length?`<p class="sub">${ls.length} lançamento(s), saldo de <b class="${tot<0?'neg':'pos'}">${brl(tot)}</b> no período.</p>`:''}</div>
  <div class="filters">
    <select id="fConta" aria-label="Conta"><option value="">Todas as contas</option>${p.contas.map(c=>`<option value="${c.id}" ${filtro.conta===c.id?'selected':''}>${esc(c.banco)} · ${TIPOS_CONTA[c.tipo]}</option>`).join('')}</select>
    <select id="fCat" aria-label="Categoria"><option value="">Todas as categorias</option>${cats.map(c=>`<option ${filtro.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
  </div>
  <section class="panel" style="padding-block:6px">${ls.length?Object.entries(dias).map(([d,arr])=>`<div class="dayhead">${dLabel(d)}</div><div class="list">${arr.map(l=>`<div class="li" tabindex="0" data-act="editLanc" data-id="${l.id}">
    <span class="ic ${l.tipo==='receita'?'in':''}">${esc(l.cat[0])}</span>

/* ---------- Questionário: fluxo ---------- */
let qz=null;
const visibles=a=>Q.filter(q=>!q.when||q.when(a));
function openQuiz(target){
  const p=target==='new'?null:P();
  qz={target,i:0,dir:'go',a:p?.quiz?JSON.parse(JSON.stringify(p.quiz)):{nome:p?.nome||'',idade:p?.idade||'',renda:p?.renda||'',dependentes:p?.dependentes||0},sel:null};
  drawQuiz(); $('#quiz').showModal();
}
function drawQuiz(){
  const qs=visibles(qz.a), done=qz.i>=qs.length, q=qs[qz.i], el=$('#qz');
  let body='';
  if(!done){
    const v=qz.a[q.k];
    body=`<div class="q">${esc(q.q)}</div>${q.h?`<p class="hint">${esc(q.h)}</p>`:''}`;
    if(q.t==='single') body+=`<div class="opts">${q.o.map(([k,l])=>`<button class="opt radio" data-opt="${k}" aria-pressed="${v===k}"><span class="ck"></span>${esc(l)}</button>`).join('')}</div>`;
    else if(q.t==='multi') body+=`<div class="opts">${q.o.map(([k,l])=>`<button class="opt" data-opt="${k}" aria-pressed="${(v||[]).includes(k)}"><span class="ck">${(v||[]).includes(k)?'✓':''}</span>${esc(l)}</button>`).join('')}</div>`;
    else if(q.t==='count') body+=`<div class="stepper"><button data-step="-1" aria-label="Menos">−</button><output id="qCount">${+v||0}</output><button data-step="1" aria-label="Mais">+</button></div>`;
    else body+=`<div class="${q.t==='money'?'amount':''}">${q.t==='money'?'<span>R$</span>':''}<input id="qIn" class="${q.t==='money'?'':'big-in'}" type="${q.t==='text'?'text':'number'}" ${q.t!=='text'?'inputmode="decimal" min="0"':''} placeholder="${esc(q.ph||'')}" value="${esc(v??'')}" aria-label="${esc(q.q)}"></div>`;
  } else {
    const a=qz.a, pl=calcPlano(a), mr=mesesReserva({tipoRenda:a.tipoRenda,dependentes:+a.dependentes,quiz:a});
    const r=+a.renda||0, sug=metasSugeridas(a,qz.target==='new'?null:P());
    if(!qz.sel) qz.sel=Object.fromEntries(sug.map((_,i)=>[i,true]));
    body=`<div class="q">Pronto, ${esc(a.nome||'')}. Montamos assim:</div>
    <div class="result">
      <div class="r"><span>Seu plano mensal</span><strong>${pl.e}% essenciais · ${pl.s}% estilo de vida · ${pl.f}% guardar</strong>
        <div class="split"><i style="width:${pl.e}%;background:var(--accent)"></i><i style="width:${pl.s}%;background:var(--gold)"></i><i style="width:${pl.f}%;background:var(--good);opacity:.5"></i></div>
        <span style="margin-top:6px">${r?`Com ${brl0(r)}: ${brl0(r*pl.e/100)}, ${brl0(r*pl.s/100)} e ${brl0(r*pl.f/100)}.`:''}${(a.dividas||[]).some(x=>['cheque','cartao','emprestimo'].includes(x))?' A parte de guardar vai primeiro para as dívidas.':''}</span></div>
      <div class="r"><span>Reserva de emergência ideal</span><strong>${mr} meses de gastos essenciais${r?`, cerca de ${brl0(r*pl.e/100*mr)}`:''}</strong></div>
      <div class="r"><span>Seu jeito de investir</span><strong>${PERFIL_INV[perfilDe(a)]}</strong></div>
      ${sug.length?`<div><div class="small muted" style="margin:6px 0 8px">Metas sugeridas (dá para ajustar os valores depois):</div><div class="opts">${sug.map((g,i)=>`<button class="opt" data-sug="${i}" aria-pressed="${!!qz.sel[i]}"><span class="ck">${qz.sel[i]?'✓':''}</span><span style="flex:1">${esc(g.nome)}</span><span class="small muted">${brl0(g.alvo)}</span></button>`).join('')}</div></div>`:''}
    </div>`;
  }
  const canSkip=S.profiles.length>0;
  el.innerHTML=`<div class="progress"><i style="width:${(done?1:qz.i/qs.length)*100}%"></i></div>
    <div class="nav"><button class="btn link" data-q="back" ${qz.i===0?'style="visibility:hidden"':''}>‹ Voltar</button><span class="small muted">${done?'':`${qz.i+1} de ${qs.length}`}</span><button class="btn link" data-q="close" style="color:var(--muted);${canSkip?'':'visibility:hidden'}">Agora não</button></div>
    <div class="body ${qz.dir}">${body}</div>
    <div class="row" style="justify-content:flex-end;flex:none">${done?`<button class="btn primary" data-q="finish" style="width:100%;padding:14px">Montar minha Caderneta</button>`:(q.t!=='single'?`<button class="btn primary" data-q="next" style="padding:12px 28px">Continuar</button>`:'')}</div>`;
  const inp=el.querySelector('#qIn'); if(inp) setTimeout(()=>inp.focus(),80);
}
function quizNext(){
  const qs=visibles(qz.a), q=qs[qz.i];
  if(q){
    if(['text','number','money'].includes(q.t)){const v=$('#qIn').value.trim();if(!v&&q.t==='text'){toast('Escreva um nome para continuar');return}qz.a[q.k]=q.t==='text'?v:(+v||0)}
    if(q.t==='multi'&&!(qz.a[q.k]||[]).length){toast('Escolha ao menos uma opção');return}
    if(q.t==='single'&&!qz.a[q.k]){toast('Escolha uma opção');return}
  }
  qz.i++; qz.dir='go'; drawQuiz();
}
function quizFinish(){
  const a=qz.a, sug=metasSugeridas(a,qz.target==='new'?null:P());
  let p;
  if(qz.target==='new'){p={id:uid(),ordem:Date.now(),limites:{},contas:[],lanc:[],metas:[]};S.profiles.push(p);S.ativo=p.id}
  else p=P();
  Object.assign(p,{nome:a.nome,idade:+a.idade||null,renda:+a.renda||0,tipoRenda:a.tipoRenda,perfilInv:perfilDe(a),dependentes:+a.dependentes||0,quiz:a});
  sug.forEach((g,i)=>{if(qz.sel?.[i]) p.metas.push({id:uid(),...g})});
  const novo=qz.target==='new';
  save(); qz=null; $('#quiz').close(); toast(`Caderneta de ${p.nome} pronta`);
  go(novo&&!p.contas.length?'contas':'inicio');
}
$('#qz').addEventListener('click',e=>{
  if(!qz) return;
  const qs=visibles(qz.a), q=qs[qz.i];
  const o=e.target.closest('[data-opt]'), st=e.target.closest('[data-step]'), sg=e.target.closest('[data-sug]'), nv=e.target.closest('[data-q]');
  if(o&&q){
    if(q.t==='single'){qz.a[q.k]=o.dataset.opt;qz.dir='';drawQuiz();const i0=qz.i;setTimeout(()=>{if(qz&&qz.i===i0){qz.i++;qz.dir='go';qz.sel=null;drawQuiz()}},220)}
    else{let arr=qz.a[q.k]||[];const k=o.dataset.opt;
      if(k===q.none) arr=arr.includes(k)?[]:[k]; else {arr=arr.filter(x=>x!==q.none);arr=arr.includes(k)?arr.filter(x=>x!==k):[...arr,k]}
      qz.a[q.k]=arr;qz.dir='';drawQuiz()}
  }
  if(st&&q){qz.a[q.k]=Math.max(0,Math.min(20,(+qz.a[q.k]||0)+ +st.dataset.step));$('#qCount').textContent=qz.a[q.k]}
  if(sg){qz.sel[sg.dataset.sug]=!qz.sel[sg.dataset.sug];qz.dir='';drawQuiz()}
  if(nv){const a=nv.dataset.q;
    if(a==='next')quizNext();
    if(a==='back'&&qz.i>0){qz.i--;qz.dir='back';qz.sel=null;drawQuiz()}
    if(a==='close')$('#quiz').close();
    if(a==='finish')quizFinish();}
});
$('#qz').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='qIn'){e.preventDefault();quizNext()}});

/* ---------- Eventos ---------- */
let toastT;
function toast(msg){const t=$('#toast');t.hidden=true;void t.offsetWidth;t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}
function armed(btn){
  if(!btn.hasAttribute('data-confirm')||btn.classList.contains('armed')) return true;
  btn.classList.add('armed');const old=btn.textContent;btn.textContent='Toque de novo para confirmar';
  setTimeout(()=>{btn.classList.remove('armed');btn.textContent=old},3000);return false;
}
document.addEventListener('click',e=>{
  if(e.target.closest('#qz')) return;
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act,id=b.dataset.id,p=P();
  if(!p&&!['novoPerfil','importar','tema','temaCiclo','sair','fechar','copiarCodigo'].includes(a)) return;
  if(!armed(b)) return;
  const done=()=>{save();render()};
  switch(a){
    case 'tab': go(id); break;
    case 'perfil': S.ativo=id; filtro={conta:'',cat:''}; save(); animate=true; render(); break;
    case 'mes': mes=addM(mes,+id); render(); break;
    case 'novoPerfil': openQuiz('new'); break;
    case 'quiz': openQuiz('edit'); break;
    case 'novoLanc': formLanc(p); break;
    case 'editLanc': formLanc(p,p.lanc.find(l=>l.id===id)); break;
    case 'delLanc': p.lanc=p.lanc.filter(l=>l.id!==id); $('#dlg').close(); toast('Lançamento excluído'); done(); break;
    case 'novaConta': formConta(p); break;
    case 'editConta': formConta(p,p.contas.find(c=>c.id===id)); break;
    case 'delConta': p.contas=p.contas.filter(c=>c.id!==id); p.lanc=p.lanc.filter(l=>l.contaId!==id); $('#dlg').close(); toast('Conta excluída'); done(); break;
    case 'verConta': filtro={conta:id,cat:''}; go('extrato'); break;
    case 'novaMeta': formMeta(p); break;
    case 'editMeta': formMeta(p,p.metas.find(g=>g.id===id)); break;
    case 'delMeta': p.metas=p.metas.filter(g=>g.id!==id); $('#dlg').close(); toast('Meta excluída'); done(); break;
    case 'addSug': { const g=metasSugeridas(p.quiz,p)[+id]; if(g){p.metas.push({id:uid(),...g});toast('Meta adicionada');done()} break; }
    case 'aporte': { const g=p.metas.find(x=>x.id===id); openForm(`Guardei mais em "${g.nome}"`,[{n:'v',l:'Quanto (R$)',t:'number',r:1,min:0.01}],v=>{g.atual+= +v.v;toast(`${brl0(+v.v)} a mais na meta`)}); break; }
    case 'novoLimite': openForm('Limite mensal',[{n:'cat',l:'Categoria',t:'select',o:[...CATS.essencial,...CATS.estilo].map(c=>`<option>${c}</option>`).join('')},{n:'v',l:'Até quanto por mês (R$)',t:'number',r:1,min:1}],v=>{p.limites=p.limites||{};p.limites[v.cat]=+v.v;toast('Limite definido')}); break;
    case 'delLimite': delete p.limites[id]; done(); break;
    case 'fechar': $('#dlg').close(); break;
    case 'sair': signOut(auth); break;
    case 'copiarCodigo': { const c=FAM?.codigo||''; try{navigator.clipboard.writeText(c).then(()=>toast('Código copiado'),()=>toast(c))}catch(err){toast(c)} break; }
    case 'tema': setTema(id); render(); toast(`Tema: ${TEMAS[id]}`); break;
    case 'temaCiclo': { const ks=Object.keys(TEMAS); setTema(ks[(ks.indexOf(tema)+1)%ks.length]); if(tab==='perfil') render(); toast(`Tema: ${TEMAS[tema]}`); break; }
    case 'exportar': { const txt=JSON.stringify(S),ta=$('#bk');ta.value=txt;
      const fb=()=>{ta.select();toast('Texto selecionado, é só copiar')};
      try{navigator.clipboard.writeText(txt).then(()=>toast('Backup copiado'),fb)}catch(err){fb()} break; }
    case 'importar': try{const d=JSON.parse($('#bk').value);if(!Array.isArray(d.profiles)||!d.profiles.length)throw 0;d.profiles.forEach((x,i)=>{normal(x);x.ordem=x.ordem||Date.now()+i});S.profiles=d.profiles;S.ativo=d.ativo;if(!P())S.ativo=S.profiles[0].id;toast('Backup importado');animate=true;done()}catch(err){toast('Esse texto não é um backup da Caderneta')} break;
    case 'limparEx': S.profiles=S.profiles.filter(x=>!x.exemplo); if(!S.profiles.length){save();openQuiz('new');break} S.ativo=S.profiles[0].id; toast('Exemplos removidos'); animate=true; done(); break;
    case 'delPerfil': if(S.profiles.length===1){toast('Crie outra pessoa antes de excluir esta');break} S.profiles=S.profiles.filter(x=>x.id!==p.id); S.ativo=S.profiles[0].id; toast('Excluído'); animate=true; done(); break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.li[data-act],.acct[data-act]')){e.preventDefault();e.target.click()}});
document.addEventListener('change',e=>{
  if(e.target.id==='fConta'){filtro.conta=e.target.value;render()}
  if(e.target.id==='fCat'){filtro.cat=e.target.value;render()}
});
$('#dlgForm').addEventListener('submit',e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(onSave)onSave(v);$('#dlg').close();save();render()});
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')$('#dlg').close()});
$('#quiz').addEventListener('close',()=>{qz=null;pendente=false;render()});
$('#dlg').addEventListener('close',flush);
if(!TABS.some(t=>t[0]===tab)) tab='inicio';
/* ---------- Entrada: login e família ---------- */
const gate=$('#gate');
const showGate=h=>{gate.innerHTML=`<div class="gcard">${h}</div>`;gate.hidden=false};
const loading=(t='')=>showGate(`<div class="spin"></div>${t?`<p class="muted" style="text-align:center">${esc(t)}</p>`:''}`);
const ERR={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'Não existe conta com esse e-mail. Toque em "Criar conta".','auth/email-already-in-use':'Esse e-mail já tem conta. Toque em "Entrar".','auth/weak-password':'A senha precisa de pelo menos 6 caracteres.','auth/invalid-email':'Esse e-mail não parece válido.','auth/network-request-failed':'Sem conexão. Verifique a internet e tente de novo.','auth/unauthorized-domain':'Este endereço ainda não está autorizado no Firebase (Authentication > Configurações > Domínios autorizados).','auth/operation-not-allowed':'Esse método de login não está ativado no Firebase (Authentication > Método de login).','auth/too-many-requests':'Muitas tentativas. Espere alguns minutos.','PERMISSION_DENIED':'Sem permissão no banco de dados. Confira se as regras foram publicadas.'};
const msgErro=e=>ERR[e?.code]||ERR[(e?.message||'').match(/PERMISSION_DENIED/)?.[0]]||'Algo deu errado. Tente de novo.';
const gErr=e=>{const el=$('#gErr');if(el){el.textContent=msgErro(e)}console.error(e)};

function telaLogin(){
  showGate(`<div class="brand">Caderneta<span>.</span></div>
    <h1>As finanças da família num lugar só.</h1>
    <p class="muted">Entre para lançar e acompanhar de qualquer celular ou computador. Cada família só enxerga os próprios dados.</p>
    <button class="btn primary" data-g="google" style="padding:13px">Entrar com Google</button>
    <div class="or">ou com e-mail</div>
    <form id="gForm" class="stack" style="gap:10px">
      <input id="gMail" type="email" placeholder="seu@email.com" autocomplete="email" required aria-label="E-mail">
      <input id="gPass" type="password" placeholder="Senha (mínimo 6 caracteres)" autocomplete="current-password" minlength="6" required aria-label="Senha">
      <div class="row"><button class="btn" type="submit">Entrar</button><button class="btn" type="button" data-g="criar">Criar conta</button><button class="btn link" type="button" data-g="reset">Esqueci a senha</button></div>
    </form>
    <p class="small neg" id="gErr" role="alert"></p>`);
}
function telaFamilia(){
  const nome=(USER.displayName||'').split(' ')[0];
  showGate(`<div class="brand">Caderneta<span>.</span></div>
    <h1>Olá${nome?', '+esc(nome):''}.</h1>
    <p class="muted">Os dados ficam numa família compartilhada. Crie a sua ou entre na de alguém com o código de convite.</p>
    <div class="gbox"><h3>Criar uma família</h3><input id="gFam" placeholder="Ex.: Família Souza" aria-label="Nome da família"><button class="btn primary" data-g="criarFam">Criar</button></div>
    <div class="gbox"><h3>Entrar com código</h3><input id="gCode" placeholder="Código de 8 letras" autocapitalize="characters" aria-label="Código de convite" style="letter-spacing:.12em;text-transform:uppercase"><button class="btn" data-g="entrarFam">Entrar na família</button></div>
    <p class="small neg" id="gErr" role="alert"></p>
    <button class="btn link" data-g="sair" style="align-self:flex-start">Usar outra conta</button>`);
}
const novoCodigo=()=>{const c='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let r='';const a=crypto.getRandomValues(new Uint32Array(8));a.forEach(n=>r+=c[n%c.length]);return r};

async function criarFamilia(nome){
  const fid=push(ref(db,'familias')).key, codigo=novoCodigo();
  await set(ref(db,`familias/${fid}`),{nome,dono:USER.uid,criada:Date.now(),codigo,membros:{[USER.uid]:true}});
  await set(ref(db,`convites/${codigo}`),fid);
  await set(ref(db,`usuarios/${USER.uid}`),{familia:fid,email:USER.email||'',nome:USER.displayName||''});
  await entrarFamilia(fid);
}
async function usarCodigo(code){
  const snap=await get(ref(db,`convites/${code}`));
  if(!snap.exists()) throw {code:'x',message:'Código não encontrado'};
  const fid=snap.val();
  await update(ref(db),{[`usuarios/${USER.uid}/convite`]:code,[`usuarios/${USER.uid}/familia`]:fid,[`usuarios/${USER.uid}/email`]:USER.email||'',[`familias/${fid}/membros/${USER.uid}`]:true});
  await entrarFamilia(fid);
}
async function entrarFamilia(fid){
  loading('Abrindo a sua Caderneta…');
  const [n,c,m]=await Promise.all(['nome','codigo','membros'].map(k=>get(ref(db,`familias/${fid}/${k}`))));
  FAM={id:fid,nome:n.val()||'Família',codigo:c.val()||'',membros:Object.keys(m.val()||{}).length};
  let primeira=true;
  unsub=onValue(ref(db,`familias/${fid}/perfis`),snap=>{
    aplicarRemoto(snap.val());
    if(primeira){primeira=false;gate.hidden=true;animate=true;render();if(!S.profiles.length)setTimeout(()=>openQuiz('new'),300)}
  },err=>{showGate(`<h1>Não foi possível abrir os dados.</h1><p class="muted">${esc(msgErro(err))}</p><button class="btn" data-g="sair">Sair</button>`)});
  onValue(ref(db,'.info/connected'),s=>syncState(!!s.val(),s.val()?'salvo':'sem conexão'));
}

gate.addEventListener('click',async e=>{
  const b=e.target.closest('[data-g]'); if(!b) return;
  const g=b.dataset.g;
  try{
    if(g==='google'){
      const prov=new GoogleAuthProvider();
      try{await signInWithPopup(auth,prov)}catch(err){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(err.code)) await signInWithRedirect(auth,prov); else if(err.code!=='auth/popup-closed-by-user'&&err.code!=='auth/cancelled-popup-request') throw err}
    }
    if(g==='criar'){const m=$('#gMail').value.trim(),s2=$('#gPass').value;if(!m||s2.length<6){$('#gErr').textContent='Preencha e-mail e uma senha de pelo menos 6 caracteres.';return}await createUserWithEmailAndPassword(auth,m,s2)}
    if(g==='reset'){const m=$('#gMail').value.trim();if(!m){$('#gErr').textContent='Escreva o seu e-mail acima primeiro.';return}await sendPasswordResetEmail(auth,m);$('#gErr').textContent='';toast('Enviamos um link para redefinir a senha')}
    if(g==='criarFam'){const n=$('#gFam').value.trim()||'Minha família';b.disabled=true;await criarFamilia(n)}
    if(g==='entrarFam'){const c=$('#gCode').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length!==8){$('#gErr').textContent='O código tem 8 letras e números.';return}b.disabled=true;await usarCodigo(c)}
    if(g==='sair') await signOut(auth);
  }catch(err){b.disabled=false;if(err.message==='Código não encontrado'){$('#gErr').textContent='Código não encontrado. Confira com quem convidou você.'}else gErr(err)}
});
gate.addEventListener('submit',async e=>{
  e.preventDefault();
  try{await signInWithEmailAndPassword(auth,$('#gMail').value.trim(),$('#gPass').value)}catch(err){gErr(err)}
});

getRedirectResult(auth).catch(gErr);
onAuthStateChanged(auth,async user=>{
  if(unsub){unsub();unsub=null}
  USER=user; FAM=null; S.profiles=[]; synced={};
  if(!user){telaLogin();return}
  loading();
  try{
    const us=await get(ref(db,`usuarios/${user.uid}/familia`));
    if(us.exists()) await entrarFamilia(us.val()); else telaFamilia();
  }catch(err){showGate(`<h1>Não foi possível abrir os dados.</h1><p class="muted">${esc(msgErro(err))}</p><button class="btn" data-g="sair">Sair</button>`)}
});
</script>
